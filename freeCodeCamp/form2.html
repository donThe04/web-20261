<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>freeCodeCamp Survey Form</title>
</head>

<body>

    <header>
        <h1 id="title">freeCodeCamp Survey Form</h1>
        <p id="description">
            Thank you for taking the time to help us improve the platform
        </p>
    </header>

    <main>
        <form id="survey-form">

            <section>
                <label id="name-label" for="name">Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your name" required>

                <br>

                <label id="email-label" for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="Enter your email" required>

                <br>

                <label id="number-label" for="number">Age (optional)</label>
                <input id="number" type="number" name="age" min="10" max="100" placeholder="Age">
            </section>

            <br>

            <section>
                <label for="dropdown">
                    Which option best describes your current role?
                </label>

                <br>

                <select id="dropdown" name="role">
                    <option value="" disabled selected>
                        Select current role
                    </option>
                    <option value="student">Student</option>
                    <option value="full-time-job">Full time job</option>
                    <option value="full-time-learner">Full time learner</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                    <option value="other">Other</option>
                </select>
            </section>

            <br>

            <section>
                <p>Would you recommend freeCodeCamp to a friend?</p>

                <input id="definitely" type="radio" name="recommend" value="definitely">
                <label for="definitely">Definitely</label>

                <input id="maybe" type="radio" name="recommend" value="maybe">
                <label for="maybe">Maybe</label>

                <input id="not-sure" type="radio" name="recommend" value="not-sure">
                <label for="not-sure">Not sure</label>
            </section>

            <br>

            <section>
                <label for="favorite">
                    What is your favorite feature of freeCodeCamp?
                </label>

                <br>

                <select id="favorite" name="favorite">
                    <option value="challenges">Challenges</option>
                    <option value="projects">Projects</option>
                    <option value="community">Community</option>
                    <option value="open-source">Open Source</option>
                </select>
            </section>

            <br>

            <section>
                <p>
                    What would you like to see improved?
                    (Check all that apply)
                </p>

                <input type="checkbox" id="frontend" name="improvement" value="frontend">
                <label for="frontend">Front-end Projects</label>

                <input type="checkbox" id="backend" name="improvement" value="backend">
                <label for="backend">Back-end Projects</label>

                <input type="checkbox" id="data" name="improvement" value="data">
                <label for="data">Data Visualization</label>

                <input type="checkbox" id="challenges" name="improvement" value="challenges">
                <label for="challenges">Challenges</label>

                <input type="checkbox" id="opensource" name="improvement" value="opensource">
                <label for="opensource">Open Source Community</label>

                <input type="checkbox" id="gitter" name="improvement" value="gitter">
                <label for="gitter">Gitter help rooms</label>

                <input type="checkbox" id="videos" name="improvement" value="videos">
                <label for="videos">Videos</label>

                <input type="checkbox" id="meetups" name="improvement" value="meetups">
                <label for="meetups">City Meetups</label>

                <input type="checkbox" id="wiki" name="improvement" value="wiki">
                <label for="wiki">Wiki</label>

                <input type="checkbox" id="forum" name="improvement" value="forum">
                <label for="forum">Forum</label>

                <input type="checkbox" id="courses" name="improvement" value="courses">
                <label for="courses">Additional Courses</label>
            </section>

            <br>

            <section>
                <label for="comments">Any comments or suggestions?</label>
                <br>
                <textarea id="comments" name="comments" rows="5" cols="30"
                    placeholder="Enter your comment here..."></textarea>
            </section>

            <br>

            <button id="submit" type="submit">Submit</button>

        </form>
    </main>

</body>

</html>
